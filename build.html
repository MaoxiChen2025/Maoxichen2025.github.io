    <div class="left-title">
         <h4>点击下面你感兴趣的项目，一起开发吧！</h4>
         <h5>文件列表</h5>
    </div>
    <div class="download-message">
    <ul id="fileList"></ul>
    <script>
        // GitHub API地址
        const repoApiUrl = "https://api.github.com/repos/MaoxiChen2025/Maoxichen2025.github.io/contents/";
        // 调用API获取文件列表并渲染
        fetch(repoApiUrl)
            .then(response => response.json())
            .then(data => {
                const fileList = document.getElementById("fileList");
                data.forEach(item => {
                    const li = document.createElement("li");
                    // 区分文件/文件夹，添加对应的链接
                    if (item.type === "dir") {
                        li.innerHTML = `📂 <a href="${item.html_url}" target="_blank">${item.name}</a>`;
                    } else {
                        li.innerHTML = `📄 <a href="${item.html_url}" target="_blank">${item.name}</a>（大小：${item.size}字节）`;
                    }
                    fileList.appendChild(li);
                });
            })
            .catch(error => {
                document.getElementById("fileList").innerHTML = "获取文件列表失败";
            });
    </script>

</font>
